<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Admin | Dynamite Faith Church International</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; }
  .boot-error {
    max-width: 560px; margin: 12vh auto; padding: 0 24px;
    color: #1F2937; line-height: 1.6;
  }
  .boot-error h1 { color: #12355B; font-size: 1.3rem; }
  .boot-error code { background: #F7F8FA; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<div class="boot-error" id="boot-error" hidden>
  <h1>The admin could not start</h1>
  <p id="boot-error-message"></p>
  <p>If this keeps happening, check that <code>admin/config.yml</code> is present
  and that the site is being served over <code>https</code>.</p>
</div>

<!--
  Sveltia CMS — an actively maintained, drop-in replacement for Decap CMS.
  It edits assets/content.json and commits changes straight to GitHub.
  Uploaded logos and photographs go to assets/img/uploads/.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.101.0/dist/sveltia-cms.js" type="module"></script>

<script type="module">
  /* The GitHub login runs on this same site (see /api/auth and /api/callback),
     so the admin works out its own address instead of having one hard-coded.
     The site can then move to a new domain, or Vercel can change the preview
     address, without anyone editing admin/config.yml. */

  function fail(message) {
    document.getElementById('boot-error-message').textContent = message;
    document.getElementById('boot-error').hidden = false;
  }

  function waitFor(test, label) {
    return new Promise(function (resolve, reject) {
      var started = Date.now();
      (function poll() {
        var value = test();
        if (value) return resolve(value);
        if (Date.now() - started > 15000) {
          return reject(new Error(label + ' could not be downloaded. Check your internet connection and reload the page.'));
        }
        setTimeout(poll, 50);
      })();
    });
  }

  try {
    const response = await fetch('config.yml', { cache: 'no-cache' });
    if (!response.ok) throw new Error('config.yml responded with ' + response.status + '.');

    const jsyaml = await waitFor(function () { return window.jsyaml; }, 'The settings reader');
    const CMS = await waitFor(function () { return window.CMS; }, 'The admin');

    const config = jsyaml.load(await response.text());
    const origin = window.location.origin;

    config.load_config_file = false;
    config.backend.base_url = origin;
    config.site_url = origin;

    CMS.init({ config });
  } catch (err) {
    fail(err.message);
  }
</script>

</body>
</html>
